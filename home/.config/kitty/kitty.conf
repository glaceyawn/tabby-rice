# ╔═══════════════════════════════════════════════════════╗
# ║ KITTY — "circuit vapor" maximalist                    ║
# ╚═══════════════════════════════════════════════════════╝

# ─── FONT ────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 11.5
disable_ligatures never
modify_font underline_position 2
modify_font underline_thickness 150%
modify_font cell_height 108%

# ─── CURSOR (trail = kitty ≥ 0.37) ───────────────────────
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6
cursor_trail 0

# ─── WINDOW ──────────────────────────────────────────────
background_opacity 0.94
background_blur 24
window_padding_width 10
window_margin_width 0
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 110c
initial_window_height 30c
enable_audio_bell no
visual_bell_duration 0.15
window_border_width 2pt
inactive_text_alpha 0.7

# ─── TAB BAR (powerline slants) ──────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_activity_symbol 󰗖
tab_title_template "{fmt.fg._6a6a6a}{index}{fmt.fg.tab} {tab.active_wd.rsplit('/',1)[-1]}"
active_tab_title_template "{fmt.fg._161616}{index}  {tab.active_wd.rsplit('/',1)[-1]}"
active_tab_font_style bold

# ─── SCROLLBACK / PERFORMANCE ────────────────────────────
scrollback_lines 50000
scrollback_pager_history_size 64
wheel_scroll_multiplier 3.0
repaint_delay 4
input_delay 1
sync_to_monitor yes

# ─── MOUSE / SELECTION ───────────────────────────────────
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
url_style curly
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks always

# ─── COLORS — managed by theme-switch ────────────────────
include colors.conf

# ─── LAYOUTS / SPLITS ────────────────────────────────────
enabled_layouts splits,stack,tall,grid,fat
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+z toggle_layout stack
map ctrl+shift+r start_resizing_window
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
map ctrl+shift+b move_window_backward
map ctrl+shift+f move_window_forward

# ─── TABS ────────────────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+alt+t set_tab_title
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# ─── KITTENS: the efficiency toys ────────────────────────
# hints: grab urls/paths/hashes/lines with keyboard only
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>w kitten hints --type word --program -
# unicode + emoji picker
map ctrl+shift+u kitten unicode_input
# scrollback in pager / last command output
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_command_output
# theme browser for when you inevitably re-rice
map ctrl+shift+f6 kitten themes
# transparency on the fly
map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default
# font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# ─── SHELL INTEGRATION ───────────────────────────────────
shell_integration enabled
# jump between prompts in scrollback
map ctrl+shift+x scroll_to_prompt -1
map ctrl+shift+d scroll_to_prompt 1

# ─── MISC ────────────────────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/kitty
clipboard_control write-clipboard write-primary read-clipboard read-primary
notify_on_cmd_finish invisible 15.0
update_check_interval 0
linux_display_server wayland
wayland_titlebar_color background
