# ╔══════════════════════════════════════════════════════════════════╗
# ║  tabby rice — hyprland                                            ║
# ║  theme colors live in colors.conf (written by theme-switch)      ║
# ╚══════════════════════════════════════════════════════════════════╝

# ─── THEME ENGINE ───────────────────────────────────────────────────
source = ~/.config/hypr/colors.conf

# ─── MONITORS + WORKSPACE PINNING ──────────────────────────────────
# generated by the installer's monitor wizard; edit or re-run install.sh
source = ~/.config/hypr/monitors.conf

# ─── ENV (NVIDIA + toolkit hints) ───────────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── AUTOSTART ──────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = ~/.local/bin/wallpaper-daemon
exec-once = sleep 0.5 && ~/.local/bin/theme-switch --restore
exec-once = hypridle
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent || /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# ─── LOOKS: the maximalist part ─────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # static border color from theme (animated borders flicker on NVIDIA)
    col.active_border   = $accent
    col.inactive_border = $bg2
    resize_on_border = true
    hover_icon_on_border = true
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.0
    dim_special = 0.35

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 0.95
        vibrancy = 0.0
        vibrancy_darkness = 0.0
        popups = true
        special = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000044)
        offset = 0 3
    }
}

animations {
    enabled = true
    # curve library
    bezier = overshot,   0.05, 0.9, 0.1, 1.08
    bezier = smoothOut,  0.36, 0,   0.66, -0.56
    bezier = smoothIn,   0.25, 1,   0.5,  1
    bezier = bounce,     1.1,  1.6, 0.1,  0.85
    bezier = liner,      1, 1, 1, 1
    bezier = dropIn,     0.34, 1.4, 0.5, 1.0

    animation = windows,      1, 3,  smoothIn, popin 90%
    animation = windowsOut,   1, 3,  smoothIn, popin 95%
    animation = windowsMove,  1, 3,  smoothIn
    animation = layers,       1, 3,  smoothIn, fade
    animation = fade,         1, 3,  smoothIn
    animation = border,       0, 1,  liner
    animation = workspaces,   1, 3,  smoothIn, slidefade 15%
    animation = specialWorkspace, 1, 5, dropIn, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    force_split = 2
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = true
    vrr = 0                # VRR causes flicker on many panels; per-monitor override in monitors.conf
    on_focus_under_fullscreen = 2
}

cursor {
    no_hardware_cursors = true   # fixes hover/type flicker on NVIDIA
    inactive_timeout = 0
}

opengl {
    nvidia_anti_flicker = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# new gesture syntax (0.51+): fingers, direction, action
gesture = 3, horizontal, workspace

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    movefocus_cycles_fullscreen = true
}

# ─── PLUGINS ────────────────────────────────────────────────────────
# On NixOS add to your config:
#   wayland.windowManager.hyprland.plugins = with pkgs.hyprlandPlugins; [
#     hyprexpo hyprtrails hyprbars borders-plus-plus
#   ];
# or system-wide: programs.hyprland.plugins = [ ... ];
# Then these blocks activate:

plugin {
    hyprexpo {                       # macOS-style workspace overview
        columns = 3
        gap_size = 10
        bg_col = rgb(161616)
        workspace_method = first 1
    }
    hyprtrails {                     # motion trails behind moving windows
        color = rgba(8fa1b333)
    }
    hyprbars {                       # title bars w/ buttons on floats
        bar_height = 26
        bar_color = rgb(1e1e1e)
        col.text = rgb(d4d4d4)
        bar_text_size = 10
        bar_text_font = JetBrainsMono Nerd Font
        bar_button_padding = 8
        bar_precedence_over_border = true
        hyprbars-button = rgb(bf8b8b), 14, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(c4a97b), 14, 󰖰, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(9ab08f), 14, 󰖯, hyprctl dispatch togglefloating
    }
    borders-plus-plus {              # extra border rings
        add_borders = 1
        col.border_1 = rgba(8fa1b322)
        border_size_1 = 2
        natural_rounding = yes
    }
}
# only show hyprbars on floating windows:
# uncomment after loading hyprbars plugin:
# windowrule = match:floating 0, plugin:hyprbars:nobar on

# ─── WINDOW RULES ───────────────────────────────────────────────────
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float on
windowrule = match:class ^(pavucontrol)$, size 900 600
windowrule = match:class ^(org.kde.dolphin)$, match:title ^(Copying|Moving|Progress).*, float on
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, size 640 360
windowrule = match:class ^(kitty)$, opacity 0.95 0.88
windowrule = match:class ^(org.kde.dolphin)$, opacity 0.97 0.9
windowrule = match:class ^(firefox)$, match:title .*(Private Browsing).*, no_blur on
# idleinhibit rule removed in 0.53 — hypridle handles this now
windowrule = match:class ^(cs2|osu!|steam_app_.*)$, immediate on
windowrule = match:class ^(vesktop|discord)$, workspace 6
windowrule = match:class ^(steam)$, workspace 7 silent

layerrule = blur on, match:namespace waybar
layerrule = blur on, ignore_alpha 1, match:namespace rofi
layerrule = blur on, ignore_alpha 1, match:namespace notifications

# ─── BINDS ──────────────────────────────────────────────────────────
$mod = SUPER

# your requested core binds
bind = $mod, B, exec, firefox
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, Q, killactive
bind = $mod, T, exec, kitty
bind = $mod, N, exec, kitty -e nvim
bind = $mod, E, exec, dolphin
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1          # maximize (keeps bar)
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod SHIFT, P, pin

# theme engine
bind = $mod, F2, exec, ~/.local/bin/theme-switch
bind = $mod, F3, exec, ~/.local/bin/wall
bind = $mod SHIFT, F3, exec, ~/.local/bin/wall random
bind = $mod, F4, exec, ~/.local/bin/bar-switch
bind = $mod SHIFT, F4, exec, ~/.local/bin/bar-monitor
bind = $mod SHIFT, H, exec, ~/.local/bin/rice-welcome

# session
bind = $mod SHIFT, Q, exit
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, R, exec, hyprctl reload && pkill waybar; waybar &

# rofi power tools
bind = $mod, D, exec, rofi -show run
bind = $mod, TAB, exec, rofi -show window
bind = $mod, period, exec, rofi -show emoji  # needs rofi-emoji; falls back silently
bind = $mod, C, exec, cliphist list | rofi -dmenu -p "󰅍 clip" | cliphist decode | wl-copy

# screenshots (grim + slurp + swappy)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "region → clipboard"
bind = SHIFT, Print, exec, grim - | wl-copy && notify-send "Screenshot" "full → clipboard"
bind = $mod, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "region → clipboard"

# notifications (mako)
bind = $mod, W, exec, makoctl dismiss
bind = $mod SHIFT, W, exec, makoctl dismiss --all
bind = $mod CTRL, W, exec, makoctl restore
bind = $mod, F1, exec, makoctl mode -t dnd && notify-send "mako" "do-not-disturb toggled"

# color picker
bind = $mod SHIFT, C, exec, hyprpicker -a && notify-send "Color" "$(wl-paste)"

# focus (arrows + vim)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
# note: $mod,L is lock; use arrows or $mod,semicolon for right
bind = $mod, K, movefocus, u
bind = $mod, semicolon, movefocus, r

# move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# resize (hold)
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, bracketright, workspace, e+1
bind = $mod, bracketleft,  workspace, e-1
bind = $mod, grave, workspace, previous          # super+` back-and-forth

# scratchpad dropdown terminal — spawns kitty into it on first use
bind = $mod, S, exec, ~/.local/bin/scratchpad-term
bind = $mod SHIFT, T, movetoworkspace, special:term
bind = $mod, M, togglespecialworkspace, music
# make the scratchpad terminal a nice floating size
windowrule = match:class ^(kitty-scratch)$, float on
windowrule = match:class ^(kitty-scratch)$, size 70% 55%
windowrule = match:class ^(kitty-scratch)$, move 15% 0%
windowrule = match:class ^(kitty-scratch)$, animation slide

# overview (hyprexpo plugin) — uncomment after loading the plugin
# bind = $mod, O, hyprexpo:expo, toggle

# groups (tabbed windows)
bind = $mod, G, togglegroup
bind = $mod ALT, left,  changegroupactive, b
bind = $mod ALT, right, changegroupactive, f

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ─── MEDIA / HARDWARE KEYS ──────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindl  = , XF86AudioStop,  exec, playerctl stop
# volume on mod+scroll as a bonus
bindel = $mod ALT, mouse_down, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mod ALT, mouse_up,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
