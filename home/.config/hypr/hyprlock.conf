# hyprlock — themed lock screen (colors from theme-engine via hyprlock-colors.conf)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
}

# big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.6)
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# avatar circle (falls back gracefully if no image)
image {
    monitor =
    path = ~/.face
    size = 130
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 30
    halign = center
    valign = center
}

# user greeting
label {
    monitor =
    text = cmd[update:0] echo "hey, $USER"
    color = $fg
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg1
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##$MUTEDHEX">enter password</span>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <span foreground="##$REDHEX">wrong ($ATTEMPTS)</span>
    rounding = 14
    position = 0, -150
    halign = center
    valign = center
}

# hint footer
label {
    monitor =
    text = 󰌾  locked
    color = $muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
