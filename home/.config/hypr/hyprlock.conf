# hyprlock — themed lock screen (colors from hyprlock-colors.conf via theme-switch)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
    immediate_render = true
}

# blurred wallpaper backdrop
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    noise = 0.0117
    contrast = 0.92
    brightness = 0.65
    vibrancy = 0.20
    vibrancy_darkness = 0.1
}

# ── time (hero) ──────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 140
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.5)
    shadow_boost = 1.2
}

# seconds — small, sits beside/under the clock as an accent
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A · %d %B')"
    color = $accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 150
    halign = center
    valign = center
}

# ── centered glass panel behind the input ────────────
shape {
    monitor =
    size = 420, 230
    color = rgba(30, 30, 30, 0.55)
    rounding = 28
    border_size = 2
    border_color = rgba(143, 161, 179, 0.35)
    position = 0, -190
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 16
    shadow_color = rgba(0,0,0,0.4)
}

# greeting
label {
    monitor =
    text = cmd[update:0] echo "hey, $USER"
    color = $fg
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -155
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = rgba(20, 20, 20, 0.85)
    font_color = $fg
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##$MUTEDHEX">󰌾  enter password</span>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <span foreground="##$REDHEX">󰀪  wrong ($ATTEMPTS)</span>
    caps_lock_color = $yellow
    rounding = 16
    position = 0, -230
    halign = center
    valign = center
}

# ── bottom status row ────────────────────────────────
# battery
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = $muted
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 40, 40
    halign = left
    valign = bottom
}

# keyboard layout hint
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $muted
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -40, 40
    halign = right
    valign = bottom
}

# lock hint centered bottom
label {
    monitor =
    text = 󰍁  locked · type to unlock
    color = $muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
