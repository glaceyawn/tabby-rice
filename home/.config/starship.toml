# STARSHIP — graphite, no powerline backgrounds
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1500
palette = "graphite"

format = """
$username$directory$git_branch$git_status$git_metrics$nix_shell$rust$nodejs$python$golang$lua$c$package$fill$cmd_duration$jobs$time
$character"""

[fill]
symbol = " "

[username]
show_always = false
style_user = "fg:accent bold"
style_root = "fg:red bold"
format = '[$user]($style) '

[directory]
style = "fg:accent bold"
read_only_style = "fg:yellow"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"/etc/nixos" = "❄ nixos"

[git_branch]
symbol = " "
style = "fg:magenta"
format = '[$symbol$branch]($style) '

[git_status]
style = "fg:yellow"
format = '[$all_status$ahead_behind]($style)'
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}/${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
deleted = "✘${count} "

[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = '[+$added]($added_style)[-$deleted]($deleted_style) '

[nix_shell]
symbol = "❄ "
style = "fg:cyan"
format = '[$symbol$state]($style) '
impure_msg = "impure"
pure_msg = "pure"

[rust]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[nodejs]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[python]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)( \($virtualenv\))]($style) '

[golang]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[lua]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[c]
symbol = " "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[package]
symbol = "󰏗 "
style = "fg:fg"
format = '[$symbol($version)]($style) '

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = '[󱦟 $duration]($style) '

[jobs]
symbol = "✦"
style = "fg:magenta"
format = '[$symbol$number]($style) '

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = '[$time]($style)'

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:magenta)"

